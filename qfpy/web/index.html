<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>牛来量化</title>
<script>try{const t=localStorage.getItem("qf-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/* 配色、字体、卡片/分区标题/KPI 的视觉规范借鉴 tick-stock-panel 前端（MIT，见 THIRD_PARTY_LICENSES.txt）：
   zinc 灰阶、蓝色强调、A 股红涨绿跌、等宽数字、左侧导航 + 顶栏、带强调竖条的分区标题。无构建步骤，纯 CSS/JS。 */
:root,[data-theme=dark]{--bg:#09090b;--panel:#0f0f12;--card:#18181b;--card2:#1f1f23;--line:#27272a;--line2:#3f3f46;--text:#fafafa;--text2:#d4d4d8;--mute:#a1a1aa;--mute2:#71717a;
  --accent:#3b82f6;--accent-soft:rgba(59,130,246,.14);--up:#ef4444;--up-soft:rgba(239,68,68,.14);--down:#22c55e;--down-soft:rgba(34,197,94,.14);--warn:#f59e0b;--warn-soft:rgba(245,158,11,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4);--input:#111114}
:root{--red:var(--up);--green:var(--down);--blue:var(--accent);--amber:var(--warn);--card-bg:var(--card)}
[data-theme=light]{--bg:#f4f4f5;--panel:#ffffff;--card:#ffffff;--card2:#fafafa;--line:#e4e4e7;--line2:#d4d4d8;--text:#18181b;--text2:#3f3f46;--mute:#71717a;--mute2:#a1a1aa;
  --accent:#2563eb;--accent-soft:rgba(37,99,235,.10);--up:#dc2626;--up-soft:rgba(220,38,38,.09);--down:#16a34a;--down-soft:rgba(22,163,74,.10);--warn:#d97706;--warn-soft:rgba(217,119,6,.10);
  --shadow:0 1px 2px rgba(0,0,0,.05);--input:#ffffff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.55 Inter,-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.num,td.n,.kpi .v,.big{font-family:"JetBrains Mono","SF Mono",Consolas,"Roboto Mono",monospace;font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
/* 布局 */
.app{display:flex;min-height:100vh}
aside{width:212px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#6366f1);display:grid;place-items:center;color:#fff}
.brand b{font-size:14px;letter-spacing:.2px}.brand small{display:block;color:var(--mute2);font-size:11px;margin-top:-2px}
#nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
#nav .grp{font-size:10.5px;color:var(--mute2);text-transform:uppercase;letter-spacing:.08em;padding:12px 10px 4px}
#nav button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--mute);padding:7px 10px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer;text-align:left;position:relative}
#nav button:hover{background:var(--card2);color:var(--text)}
#nav button.on{background:var(--accent-soft);color:var(--text);font-weight:600}
#nav button.on::before{content:"";position:absolute;left:-8px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
#nav button svg{flex:none;opacity:.85}
#nav .dot{margin-left:auto;width:7px;height:7px;border-radius:50%}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:8px;color:var(--mute2);font-size:11px}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:8px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{color:var(--text);border-color:var(--line2)}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
.topbar .sub{color:var(--mute2);font-size:12px}
#hdr{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
main{padding:18px 22px 40px;max-width:1440px;width:100%}
/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:8px;color:var(--text)}
.card h3::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--accent);flex:none}
.card h3 .r{margin-left:auto;font-weight:400}
.card.flat{box-shadow:none;background:var(--card2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid>.card{margin-bottom:0}
.grid+.card,.grid+.grid{margin-top:14px}
.span2{grid-column:span 2}@media(max-width:900px){.span2{grid-column:auto}}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.kpi{background:var(--card);padding:12px 14px;min-width:0}
.kpi .l{font-size:11px;color:var(--mute2);letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:19px;font-weight:650;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:11.5px;color:var(--mute);margin-top:1px}
.bar{height:6px;border-radius:6px;background:var(--card2);border:1px solid var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.warn>i{background:var(--warn)}.bar.hot>i{background:var(--up)}
/* 徽章 */
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:11.5px;line-height:19px;background:var(--card2);color:var(--text2);border:1px solid var(--line);white-space:nowrap}
.pill.red{background:var(--up-soft);color:var(--up);border-color:transparent}.pill.green{background:var(--down-soft);color:var(--down);border-color:transparent}
.pill.blue{background:var(--accent-soft);color:var(--accent);border-color:transparent}.pill.amber{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.live .d{animation:pulse 1.6s infinite}@keyframes pulse{50%{opacity:.35}}
/* 按钮 */
button.btn{border:1px solid var(--line2);background:var(--card2);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;font:inherit;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;transition:.12s}
button.btn:hover{border-color:var(--mute2);background:var(--card)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.primary:hover{background:var(--accent);filter:brightness(1.1)}
button.danger{background:var(--up);border-color:var(--up);color:#fff}button.danger:hover{background:var(--up);filter:brightness(1.1)}
button.ghost{background:transparent;border-color:transparent;color:var(--mute)}button.ghost:hover{color:var(--text)}
button.small{padding:2px 8px;font-size:11.5px;border-radius:6px}
button:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--mute);padding:5px 11px;border-radius:7px;cursor:pointer;font:inherit;font-size:12.5px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow);font-weight:600}
/* 表格 */
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{color:var(--mute2);font-weight:500;font-size:11.5px;background:var(--card2);position:sticky;top:0;white-space:nowrap}
tr:last-child td{border-bottom:0}tbody tr:hover td,table tr:hover td{background:color-mix(in srgb,var(--card2) 60%,transparent)}
td.n,th.n{text-align:right}
/* 表单 */
input,select,textarea{font:inherit;font-size:12.5px;border:1px solid var(--line2);border-radius:7px;padding:5px 8px;background:var(--input);color:var(--text);outline:none}
select{max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;vertical-align:-2px}
input[type=number]{width:120px}textarea{width:100%;min-height:58px;font-family:"JetBrains Mono",Consolas,monospace;font-size:12px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:8px 14px;align-items:center}
.kv>div:nth-child(odd){color:var(--mute);font-size:12.5px}
/* 文字 */
.mute{color:var(--mute)}.up{color:var(--up)}.down{color:var(--down)}.small{font-size:11.5px}.warn-t{color:var(--warn)}
.big{font-size:22px;font-weight:700}
pre{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:11.5px;color:var(--text2)}
details summary{cursor:pointer;color:var(--accent);font-size:12px;margin:4px 0;user-select:none}
.warn{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--text);border-radius:9px;padding:8px 12px;margin:8px 0}
.warn.bad{background:var(--up-soft);border-color:color-mix(in srgb,var(--up) 35%,transparent)}
.ok-box{background:var(--down-soft);border:1px solid color-mix(in srgb,var(--down) 35%,transparent);border-radius:9px;padding:8px 12px;margin:8px 0}
/* 开关 */
.switch{position:relative;width:58px;height:30px;border-radius:15px;background:var(--line2);cursor:pointer;border:0;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.switch.on{background:var(--down)}.switch.on::after{left:31px}
.hero{display:flex;align-items:center;gap:18px;justify-content:space-between;position:relative;overflow:hidden}
.hero.on{border-color:color-mix(in srgb,var(--down) 55%,transparent);background:linear-gradient(90deg,var(--down-soft),var(--card) 55%)}
.hero .t{font-size:18px;font-weight:700}
/* 漏斗 */
.fun{display:flex;flex-direction:column;gap:6px;margin:4px 0 6px}
.fun .st{display:grid;grid-template-columns:170px 1fr 120px;gap:12px;align-items:center}
.fun .lab{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fun .lab .ix{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:var(--card2);border:1px solid var(--line);font-size:10.5px;color:var(--mute);margin-right:6px}
.fun .trk{height:22px;border-radius:6px;background:var(--card2);position:relative;overflow:hidden}
.fun .trk i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#8b5cf6));min-width:3px}
.fun .trk b{position:absolute;left:8px;top:2px;font-size:11.5px;color:#fff;font-family:"JetBrains Mono",Consolas,monospace;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.fun .drop{font-size:11.5px;color:var(--mute2);text-align:right}
.fun .st.pick .trk i{background:linear-gradient(90deg,var(--up),#f97316)}
.stage{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:9px 12px;margin:8px 0;background:var(--card2)}
.stage .cnt{font-weight:700;font-family:"JetBrains Mono",Consolas,monospace}
.factor{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--card2)}
.factor.off{opacity:.5}
.tiercol{flex:1;min-width:250px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--card);color:var(--text);border:1px solid var(--line2);border-left:3px solid var(--accent);padding:10px 14px;border-radius:10px;max-width:480px;z-index:99;white-space:pre-wrap;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.toast.err{border-left-color:var(--up)}
svg text{font-size:10.5px;fill:var(--mute2);font-family:"JetBrains Mono",Consolas,monospace}
.empty{color:var(--mute2);font-size:12px;padding:14px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.conn{display:flex;align-items:center;gap:12px}
.conn .ring{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.conn .ring.ok{background:var(--down-soft);color:var(--down)}.conn .ring.bad{background:var(--up-soft);color:var(--up)}.conn .ring.unk{background:var(--card2);color:var(--mute)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mute)}
@media (max-width:860px){aside{display:none}.kv{grid-template-columns:1fr}main{padding:12px}.fun .st{grid-template-columns:110px 1fr 70px}.mnav{display:flex!important}}
.mnav{display:none;gap:4px;overflow:auto;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.mnav button{border:0;background:none;color:var(--mute);padding:5px 9px;border-radius:7px;font:inherit;white-space:nowrap}.mnav button.on{background:var(--accent-soft);color:var(--text)}
/* —— 精简版新增 —— */
.hero.halted{border-color:color-mix(in srgb,var(--up) 55%,transparent);background:linear-gradient(90deg,var(--up-soft),var(--card) 55%)}
button.danger,.btn.danger{background:var(--up);border-color:var(--up);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;line-height:18px;padding:0 7px;border-radius:999px;border:1px solid var(--line);color:var(--mute);background:var(--card2);white-space:nowrap;cursor:default}
.chip.hit{background:var(--up-soft);color:var(--up);border-color:transparent;font-weight:600}

.chk{font-size:11.5px;line-height:1.5}.chk.y{color:var(--up)}.chk.n{color:var(--mute)}
.lyd{border-left:3px solid var(--line2);padding:3px 8px;margin:4px 0}.lyd.hit{border-left-color:var(--up)}.lyd.due{border-left-color:var(--warn)}
.mx td.cell{vertical-align:top;min-width:130px}.mx td.cell.hit{background:var(--up-soft)}.mx td.cell.due{background:var(--warn-soft)}
.mx td.cell>b{font-size:12px}.mx td.cell.hit>b{color:var(--up)}.mx td.cell.due>b{color:var(--warn)}.mx td.cell.idle>b{color:var(--mute)}
.layer{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 12px;background:var(--card2)}
.layer.stop{border-left-color:var(--up)}.layer.off{opacity:.55}
.layer .lhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.layer .ix{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px}

.params{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:6px}
.param{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--mute);min-width:150px}
.param.wide{flex:1 1 100%}.param input[type=number]{width:110px}.param textarea{width:100%;min-height:54px;font-family:"JetBrains Mono",Consolas,monospace;font-size:11.5px}

/* —— 牛来量化：居中布局、顶栏开关、首页行情 —— */

.topbar{justify-content:center}
